<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>จดหมายวันเกิดแม่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: cover seal -> a stack of five slightly tilted envelopes -> each opens as a paper sheet with its own little game */
:root{
  --bg:#EEEBFF; --ink:#2B2350; --muted:#625A8C; --paper:#FFFFFF; --line:#E1DCF7;
  --accent:#E21F64; --on-accent:#FFFFFF; --sun:#FFC93C; --mint:#3FCFA0; --sky:#6CB8FF; --lilac:#B79BFF;
  --on-env:#2B2350; --shadow:0 12px 24px -14px rgba(43,35,80,.45);
  --e1:#FFC6D9; --e2:#FFE49A; --e3:#B6EFDB; --e4:#BFDFFF; --e5:#DACDFF;
  --f-display:'Mitr','Noto Sans Thai',sans-serif;
  --f-hand:'Mali','Mitr',cursive;
  --f-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --b1:rgba(255,143,177,.50); --b2:rgba(108,184,255,.45); --b3:rgba(255,201,60,.40); --ray:rgba(255,201,60,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17133A; --ink:#F3F0FF; --muted:#B6AEDF; --paper:#262058; --line:#3A3375;
    --accent:#FF6B97; --on-accent:#2B2350; --b1:rgba(255,107,151,.26); --b2:rgba(80,140,255,.30); --b3:rgba(183,155,255,.26); --ray:rgba(255,201,60,.14); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17133A; --ink:#F3F0FF; --muted:#B6AEDF; --paper:#262058; --line:#3A3375;
  --accent:#FF6B97; --on-accent:#2B2350; --b1:rgba(255,107,151,.26); --b2:rgba(80,140,255,.30); --b3:rgba(183,155,255,.26); --ray:rgba(255,201,60,.14); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--line) 1.5px, transparent 1.7px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  min-height:100%;
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
h1,h2{font-family:var(--f-display); font-weight:500; margin:0; text-wrap:balance}
p{margin:0}
.app{max-width:520px; margin:0 auto; padding-block:14px 36px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* bunting */
.bunting{display:flex; justify-content:space-around; border-top:2px solid var(--ink); margin:0 -8px 14px}
.bunting i{width:26px; height:34px; clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:50% 0; animation:sway 3s ease-in-out infinite alternate}
.bunting i:nth-child(5n+1){background:var(--accent)} .bunting i:nth-child(5n+2){background:var(--sun)}
.bunting i:nth-child(5n+3){background:var(--mint)} .bunting i:nth-child(5n+4){background:var(--sky)} .bunting i:nth-child(5n+5){background:var(--lilac)}
.bunting i:nth-child(even){animation-delay:-1.4s}

/* head */
.head{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; margin-bottom:22px}
.head h1{font-size:clamp(34px,10vw,46px); line-height:1.15}
.head h1 em{font-style:normal; color:var(--accent)}
.head p{color:var(--muted); margin-top:8px; max-width:30ch}
.mascot{display:block; width:128px; height:auto; overflow:visible}
.mascot.sm{width:76px}
.m-hat{fill:var(--accent)} .m-pom{fill:var(--sun)}
.m-eye{transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite}
.m-wave{transform-box:fill-box; transform-origin:0% 100%; animation:wave 1.6s ease-in-out infinite}
.m-bob{animation:bobm 3.4s ease-in-out infinite}

/* envelopes */
.board{display:grid; gap:16px; padding-inline:4px}
.env{--c:var(--e1); position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; width:100%; text-align:left;
  padding:18px 16px; border:0; border-radius:14px; background:var(--c); color:var(--on-env); box-shadow:var(--shadow); overflow:hidden;
  transition:transform .2s ease}
.env::before{content:""; position:absolute; inset:0 0 auto 0; height:56%; background:color-mix(in srgb,var(--c) 70%,#2B2350); opacity:.28; clip-path:polygon(0 0,100% 0,50% 100%); pointer-events:none}
.env>*{position:relative; z-index:1}
.env:nth-child(odd){transform:rotate(-1.4deg)} .env:nth-child(even){transform:rotate(1.1deg)}
.env:hover,.env:focus-visible{transform:translateY(-3px) rotate(0)}
.opened .env{animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.opened .env:nth-child(2){animation-delay:.08s} .opened .env:nth-child(3){animation-delay:.16s}
.opened .env:nth-child(4){animation-delay:.24s} .opened .env:nth-child(5){animation-delay:.32s}
.stamp{width:54px; height:62px; display:grid; place-items:center; background:#FFFDF8; border:2px dashed rgba(43,35,80,.45); border-radius:3px; transform:rotate(4deg)}
.stamp svg{width:30px; height:30px}
.env b{display:block; font:500 20px/1.3 var(--f-display)}
.env small{display:block; font-size:14px; opacity:.8}
.go{font-size:13px; font-weight:700; padding:3px 10px; border-radius:99px; background:rgba(255,255,255,.65)}
.foot{margin-top:26px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px}

/* cover */
.cover{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
  padding:max(20px, env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) max(20px, env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));
  background-color:var(--bg); background-image:radial-gradient(var(--line) 1.5px, transparent 1.7px); background-size:22px 22px; transition:transform .9s cubic-bezier(.7,0,.3,1)}
.cover.lift{transform:translateY(-105%)}
.cover .mascot{width:170px}
.cover .kicker{color:var(--muted); margin-top:6px}
.cover h1{font-size:clamp(46px,16vw,72px); line-height:1.1}
.cover .from{color:var(--muted); margin-bottom:12px}
.seal{position:relative; width:104px; height:104px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center;
  box-shadow:0 10px 0 -2px color-mix(in srgb,var(--accent) 60%,#2B2350); transition:transform .15s}
.seal:active{transform:translateY(4px)}
.seal::before,.seal::after{content:""; position:absolute; inset:-8px; border-radius:50%; border:3px solid var(--accent); opacity:0; animation:ring 2.2s ease-out infinite}
.seal::after{animation-delay:1.1s}
.seal svg{width:44px; height:44px}
.seal-label{font:500 15px var(--f-display); color:var(--ink)}

/* sheet */
.sheet{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(23,19,58,.55); backdrop-filter:blur(3px);
  padding:calc(max(12px, env(safe-area-inset-top,0px)) + 44px) max(12px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.paper{position:relative; width:min(100%,480px); max-height:100%; overflow-y:auto; overscroll-behavior:contain; background:var(--paper); color:var(--ink); border-radius:18px; padding:24px 20px 22px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5); animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
.close{position:absolute; top:max(10px, env(safe-area-inset-top,0px)); right:max(12px, env(safe-area-inset-right,0px)); width:40px; height:40px; border-radius:50%; border:0; background:var(--paper); color:var(--ink); font-size:22px; line-height:1; box-shadow:var(--shadow)}
.paper h2{font-size:24px; line-height:1.3; margin-bottom:6px}
.lead{color:var(--muted); margin-bottom:14px}
.hint{color:var(--muted); font-size:13px; margin-top:10px}
.pill{display:inline-block; margin-top:14px; padding:10px 22px; border:0; border-radius:99px; background:var(--accent); color:var(--on-accent); font:500 17px var(--f-display); box-shadow:0 5px 0 -1px color-mix(in srgb,var(--accent) 55%,#2B2350)}
.pill:active{transform:translateY(3px); box-shadow:none}
.pill.ghost-btn{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.center{text-align:center}

/* letter 1 */
.hand{font-family:var(--f-hand); font-size:17px; line-height:34px}
.stack{display:grid; margin-top:10px; cursor:pointer; background:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px)}
.stack>*{grid-area:1/1; white-space:pre-wrap; overflow-wrap:break-word; margin:0}
.stack .ghost{visibility:hidden}
.typing::after{content:"|"; color:var(--accent); animation:blink2 .9s steps(2) infinite}
.sign{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-top:12px; animation:rise .6s both}

/* balloons */
.balloons{display:grid; grid-template-columns:repeat(3,1fr); gap:30px 6px; justify-items:center; padding-top:8px}
.balloon{position:relative; width:88px; height:108px; padding:0; border:0; background:none; transition:transform 1s cubic-bezier(.3,.7,.4,1), opacity .9s ease}
.balloon .b{position:absolute; inset:0; display:grid; place-items:center; padding:10px; border-radius:50% 50% 47% 47% / 57% 57% 43% 43%; background:var(--c); color:var(--on-env);
  font:600 13px/1.25 var(--f-body); text-align:center; box-shadow:inset -8px -10px 0 rgba(43,35,80,.1); animation:bobb 3s ease-in-out infinite; animation-delay:var(--d)}
.balloon::after{content:""; position:absolute; left:50%; top:100%; width:2px; height:26px; background:var(--muted); opacity:.6}
.balloon.gone{transform:translateY(-460px) rotate(10deg); opacity:0; pointer-events:none}
.count{margin-top:18px; font:500 16px var(--f-display); color:var(--muted)}

/* cake */
.cake{display:block; width:min(100%,300px); margin:6px auto 0; cursor:pointer}
.flame{transform-box:fill-box; transform-origin:50% 100%; animation:flick .5s ease-in-out infinite alternate}
.out .flame{animation:none; transform:scale(0); transition:transform .25s ease var(--t,0s)}
.smoke{opacity:0}
.out .smoke{animation:smoke 1.6s ease-out forwards; animation-delay:var(--t,0s)}
.wish{min-height:3.4em; margin-top:10px; font:400 17px/1.7 var(--f-hand)}

/* card draw */
.deck{perspective:900px; width:min(100%,280px); height:340px; margin:8px auto 0}
.card3d{position:relative; width:100%; height:100%; border:0; padding:0; background:none; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.8,.3,1)}
.card3d.flip{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:22px; box-shadow:var(--shadow)}
.face.front{background:var(--lilac); color:#2B2350; border:4px solid #2B2350;
  background-image:radial-gradient(rgba(255,255,255,.55) 3px, transparent 3.5px); background-size:26px 26px}
.face.back{background:var(--e2); color:#2B2350; transform:rotateY(180deg); border:4px solid #2B2350}
.face .tiny{font:600 13px var(--f-body); letter-spacing:.04em}
.face .big{font:400 21px/1.65 var(--f-hand); text-align:center}
.face.front b{font:500 20px var(--f-display); background:#FFFDF8; padding:6px 16px; border-radius:99px}

/* scratch */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{position:relative; min-height:136px; border-radius:12px; overflow:hidden; background:var(--e2); color:#2B2350}
.tile:nth-child(2){background:var(--e3)} .tile:nth-child(3){background:var(--e4)} .tile:nth-child(4){background:var(--e1)}
.prize{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:12px; text-align:center; border:2px dashed rgba(43,35,80,.4); border-radius:12px}
.prize b{font:500 16px/1.35 var(--f-display)} .prize span{font-size:13px; line-height:1.4}
.tile canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; transition:opacity .6s}
.tile canvas.done{opacity:0; pointer-events:none}


/* background + effects */
.blobs{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
.blobs span{position:absolute; width:90vmax; height:90vmax; border-radius:50%; animation:drift 22s ease-in-out infinite alternate}
.blobs span:nth-child(1){left:-40vmax; top:-40vmax; background:radial-gradient(circle,var(--b1),transparent 62%)}
.blobs span:nth-child(2){right:-45vmax; top:10vh; background:radial-gradient(circle,var(--b2),transparent 62%); animation-duration:28s; animation-delay:-8s}
.blobs span:nth-child(3){left:-20vmax; bottom:-50vmax; background:radial-gradient(circle,var(--b3),transparent 62%); animation-duration:25s; animation-delay:-14s}
#bgc{position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.cover{overflow:hidden}
.cover>*{position:relative; z-index:1}
.cover>.blobs{position:absolute; z-index:0}
.cover>.rays{position:absolute; z-index:0; left:50%; top:40%; width:160vmax; height:160vmax; margin:-80vmax 0 0 -80vmax; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, var(--ray) 0 9deg, transparent 9deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 50%); mask-image:radial-gradient(circle,#000 0,transparent 50%); animation:spin 50s linear infinite}
.head h1 em{background:linear-gradient(90deg,var(--accent),#FF9A3C,var(--accent)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 4s linear infinite}
.env::after{content:""; position:absolute; left:14%; right:14%; bottom:0; height:70%; background:#fff; border-radius:6px 6px 0 0; transform:translateY(105%); z-index:0; pointer-events:none}
.env.opening{transform:translateY(-4px) rotate(0)}
.env.opening::before{transform-origin:50% 0; animation:flap .4s ease-out forwards}
.env.opening::after{animation:peek .4s .08s ease-out forwards}
.cakewrap{position:relative; width:min(100%,300px); margin:6px auto 0}
.cakewrap::before{content:""; position:absolute; left:50%; top:4%; width:96%; aspect-ratio:1; transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(circle,rgba(255,201,60,.55),transparent 65%); animation:glow 1.6s ease-in-out infinite alternate; transition:opacity .6s}
.cakewrap.out::before{opacity:0; animation:none}
.cakewrap .cake{position:relative; width:100%; margin:0}
.banner{display:flex; justify-content:center; flex-wrap:wrap; min-height:44px; margin-top:4px; font:600 30px/1.4 var(--f-display); color:var(--accent)}
.banner span{display:inline-block; animation:letter .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i) * 70ms)}
.photoask{margin-top:16px; padding-top:16px; border-top:2px dashed var(--line); text-align:center; animation:rise .6s both}
.ask{font-size:19px; line-height:1.7}
.photoask .pill{margin:8px 4px 0}
.polaroid{margin:20px auto 4px; width:min(100%,260px); background:#fff; color:#2B2350; padding:10px 10px 12px; border-radius:4px; box-shadow:var(--shadow); transform:rotate(-3deg); animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
.polaroid img{display:block; width:100%; aspect-ratio:1; object-fit:cover; background:#EEE}
.polaroid .cap{margin-top:8px; font-size:15px; line-height:1.6; text-align:center}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes flap{to{transform:scaleY(0); opacity:.1}}
@keyframes peek{to{transform:translateY(16%)}}
@keyframes glow{from{opacity:.55; transform:translateX(-50%) scale(.94)}to{opacity:1; transform:translateX(-50%) scale(1.04)}}
@keyframes letter{from{opacity:0; transform:translateY(24px) scale(.5) rotate(-12deg)}to{opacity:1; transform:none}}
@keyframes drop{from{opacity:0; transform:translateY(-60px) rotate(8deg) scale(1.2)}to{opacity:1; transform:rotate(-3deg)}}

#fx{position:fixed; inset:0; width:100%; height:100%; z-index:200; pointer-events:none}

@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes bobm{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0; transform:translateY(22px)}to{opacity:1}}
@keyframes ring{0%{opacity:.7; transform:scale(.9)}100%{opacity:0; transform:scale(1.5)}}
@keyframes pop{from{opacity:0; transform:translateY(40px) scale(.92)}to{opacity:1; transform:none}}
@keyframes blink2{50%{opacity:0}}
@keyframes bobb{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}
@keyframes smoke{0%{opacity:.7; transform:translateY(0)}100%{opacity:0; transform:translateY(-34px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  .cover{transition:none}
}
</style>
</head>
<body>

<div class="blobs" aria-hidden="true"></div>
<canvas id="bgc" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="cover" id="cover">
  <div class="blobs" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"></div>
  <div id="coverMascot"></div>
  <p class="kicker">มีของขวัญมาส่งถึง</p>
  <h1 id="coverName"></h1>
  <button class="seal" id="seal" aria-label="เปิดของขวัญ">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/></svg>
  </button>
  <span class="seal-label">แตะเพื่อเปิด</span>
</div>

<main class="app" id="app">
  <div class="bunting" id="bunting" aria-hidden="true"></div>
  <header class="head">
    <div>
      <h1>สุขสันต์<em>วันเกิด</em><br><span id="headName"></span></h1>
      <p>มีจดหมายสามฉบับรออยู่ แตะซองเพื่อเปิดอ่านได้เลย</p>
    </div>
    <div id="headMascot"></div>
  </header>
  <section class="board" id="board" aria-label="จดหมายทั้งหมด"></section>
  <div class="foot"><div id="footMascot"></div><p id="footText"></p></div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="จดหมาย">
  <button class="close" id="close" aria-label="ปิดจดหมาย">&times;</button>
  <div class="paper" id="paper"></div>
</div>

<script>
/* ===== แก้ข้อความทั้งหมดได้ที่นี่ ===== */
const CONFIG = {
  momName: 'แม่',
  fromName: 'ลูก',
  mascotName: 'โมจิ',
  letter: [
    'สุขสันต์วันเกิดนะแม่',
    'ปีนี้ลูกมีของขวัญชิ้นเล็กๆ มาฝาก ไม่ต้องใหญ่ ไม่ต้องแพง แค่อยากให้แม่ยิ้มตอนเปิดดู',
    'ขอให้ปีนี้เป็นปีที่แม่ไม่ต้องคิดเยอะ ไม่ต้องแบกอะไรไว้คนเดียว ตลอดเวลา',
    'นอนเต็มอิ่ม กินข้าวอร่อย หัวเราะบ่อยๆ และมีความสุขมากๆ ทุกวัน ก็พอ'
  ],
  cakeWish: 'ขอพรในใจได้หนึ่งข้อ แล้วเก็บไว้เงียบๆ นะแม่ เดี๋ยวมันก็เป็นจริง',
  photoAsk: 'ขอรูปคู่กับพ่อ 1 รูปของปีนี้นะแม่',
  photoCaption: 'แม่กับพ่อ ปี',
  photoThanks: 'ขอบคุณนะแม่ เก็บรูปนี้ไว้ แล้วส่งให้ลูกด้วยนะ',

/* ---------- confetti ---------- */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], raf = 0, dpr = 1;
function sizeFx() { dpr = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
sizeFx(); addEventListener('resize', sizeFx);
function heartPath(c, s) { c.beginPath(); c.moveTo(0, s * .35); c.bezierCurveTo(-s, -s * .4, -s * .3, -s, 0, -s * .35); c.bezierCurveTo(s * .3, -s, s, -s * .4, 0, s * .35); c.fill(); }
function burst(x, y, n = 70, power = 1) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, vx: (Math.random() - .5) * 12 * power, vy: -Math.random() * 11 * power - 2, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
      s: 6 + Math.random() * 7, c: COLORS[i % COLORS.length], heart: Math.random() < .35, age: 0 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.age < 150 && p.y < innerHeight + 30);
  for (const p of parts) {
    p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.age++;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.globalAlpha = Math.min(1, (150 - p.age) / 40);
    if (p.heart) heartPath(fctx, p.s); else fctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
    fctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}
const burstAt = (el, n, power) => { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n, power); };

function firework(x, y) {
  if (reduce) return;
  const c = COLORS[(Math.random() * COLORS.length) | 0], n = 44;
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.283, sp = 3 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 0, vr: .2, s: 5 + Math.random() * 4, c: Math.random() < .3 ? '#FFC93C' : c, heart: i % 4 === 0, age: 40 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function rain(ms) {
  if (reduce) return 0;
  const t0 = performance.now();
  const id = setInterval(() => {
    if (performance.now() - t0 > ms) { clearInterval(id); return; }
    for (let k = 0; k < 4; k++) parts.push({ x: Math.random() * innerWidth, y: -10, vx: (Math.random() - .5) * 2, vy: Math.random() * 2 + 1, r: Math.random() * 6, vr: (Math.random() - .5) * .2, s: 6 + Math.random() * 6, c: COLORS[(Math.random() * COLORS.length) | 0], heart: Math.random() < .3, age: 20 });
    if (!raf) raf = requestAnimationFrame(tick);
  }, 70);
  return id;
}
addEventListener('pointerdown', e => {
  if (reduce) return;
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * 6.283, sp = 2 + Math.random() * 3;
    parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, r: 0, vr: .2, s: 5 + Math.random() * 5, c: COLORS[i % COLORS.length], heart: i % 2 === 0, age: 100 });

let bgp = [];
function sizeBg() { bgc.width = innerWidth * dpr; bgc.height = innerHeight * dpr; }
function initBg() {

}
function drawBg(t) {
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0); bctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of bgp) {
    if (!reduce && !document.hidden) { p.y -= p.v; if (p.y < -30) { p.y = innerHeight + 30; p.x = Math.random() * innerWidth; } }

    bctx.restore();

  if (!reduce) requestAnimationFrame(drawBg);
}

}
board.addEventListener('click', e => {
  const b = e.target.closest('.env'); if (!b || b.classList.contains('opening')) return;
  const i = +b.dataset.i;
  if (reduce) { openLetter(i); return; }
  b.classList.add('opening'); burstAt(b, 20, .5);
  setTimeout(() => { openLetter(i); b.classList.remove('opening'); }, 430);
});
$('#close').addEventListener('click', closeLetter);
sheet.addEventListener('click', e => { if (e.target === sheet) closeLetter(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeLetter(); });

$('#seal').addEventListener('click', () => {
  const s = $('#seal');
  burstAt(s, 90, 1.3);
  const cover = $('#cover');
  cover.classList.add('lift'); $('#app').classList.add('opened');
  setTimeout(() => { cover.hidden = true; }, reduce ? 20 : 950);
});
</script>

</body>
</html>
